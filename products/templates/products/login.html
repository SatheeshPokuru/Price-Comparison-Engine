{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        body{

            margin:0;

            padding:0;

            font-family:Arial;

            background:linear-gradient(
                to right,
                #141e30,
                #243b55
            );

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

        }

        .auth-container{

            background:white;

            padding:40px;

            width:350px;

            border-radius:15px;

            box-shadow:0 0 20px rgba(0,0,0,0.3);

            text-align:center;

        }

        h1{

            margin-bottom:30px;

            color:#243b55;

        }

        input{

            width:100%;

            padding:12px;

            margin-bottom:20px;

            border:1px solid #ccc;

            border-radius:8px;

            font-size:16px;

        }

        button{

            width:100%;

            padding:12px;

            border:none;

            background:#243b55;

            color:white;

            font-size:16px;

            border-radius:8px;

            cursor:pointer;

            transition:0.3s;

        }

        button:hover{

            background:#141e30;

        }

        .error{

            color:red;

            margin-top:10px;

        }

        a{

            text-decoration:none;

            color:#243b55;

            font-weight:bold;

        }

    </style>

</head>

<body>

    <div class="auth-container">

        <h1>Welcome Back</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <br>

        <p>

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </p>

        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}

    </div>

</body>

</html>
